<body>

<div id="progress-bar"></div>

<nav class="navdots">
  <button data-target="hero" aria-label="hi"></button>
  <button data-target="reasons" aria-label="why"></button>
  <button data-target="gallery" aria-label="gallery"></button>
  <button data-target="letter" aria-label="letter"></button>
  <button data-target="future" aria-label="someday"></button>

<section class="hero" id="hero">
  <div class="glow-blob" style="width:460px;height:460px;background:radial-gradient(circle, var(--glow-cyan), transparent 70%); top:-140px; left:-100px;"></div>
  <div class="glow-blob" style="width:380px;height:380px;background:radial-gradient(circle, var(--glow-lime), transparent 70%); bottom:-160px; right:-80px; animation-delay:-9s;"></div>
  <canvas id="hero-canvas"></canvas>
  <div class="floaters" id="hero-floaters"></div>
  <div class="hero-content">
    <p class="eyebrow" id="heroEyebrow"></p>
    <h1 id="heroTitle"></h1>
    <p class="tagline" id="heroTagline"></p>
    <div class="counter">
      <div class="unit"><span class="num" id="c-days">0</span><span class="unit-label">days</span></div>
      <div class="unit"><span class="num" id="c-hours">00</span><span class="unit-label">hours</span></div>
      <div class="unit"><span class="num" id="c-mins">00</span><span class="unit-label">mins</span></div>
      <div class="unit"><span class="num" id="c-secs">00</span><span class="unit-label">secs</span></div>
    </div>
    <p class="counter-label" id="heroCounterCaption"></p>
    <p class="scroll-cue">scroll<span>↓</span></p>
  </div>
</section>

<section class="reveal" id="reasons">
  <p class="reveal-label fade-in" id="revealLabel"></p>
  <div class="reveal-list" id="revealList"></div>
</section>

<section class="gallery" id="gallery">

  <div class="gallery-sticky">
    <div class="gallery-track" id="galleryTrack"></div>
    <p class="gallery-index" id="galleryIndex"></p>
  </div>
</section>

<section class="letter" id="letter">

    <p class="salutation fade-in" id="letterSalutation"></p>
    <div id="letterParagraphs"></div>
    <p class="signature fade-in" id="letterSignature"></p>
  </div>
</section>
